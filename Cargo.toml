[package]
name = "algea"
version = "0.2.0"
edition = "2024"
autobenches = false
description = "Small fixed-size SIMD-oriented vectors and matrices"
readme = "README.md"
license = "MIT OR Apache-2.0"
documentation = "https://docs.rs/algea"
repository = "https://github.com/atynagano/algea"
homepage = "https://github.com/atynagano/algea"
keywords = ["linear-algebra", "matrix", "simd", "vector"]
categories = ["mathematics"]
include = [
    "/build.rs",
    "/src/**/*.rs",
    "/examples/**",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
]

[dependencies]
paste = "1"
# Pin the full version because extensive `bytemuck::cast` use depends on compatible type layouts.
wide = "=1.6.1"

[dev-dependencies]
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support", "html_reports", "plotters"] }
glam = { version = "0.33.2", features = ["fast-math"] }
nalgebra = "0.35.0"

[[bench]]
name = "benchmarks"
harness = false

[lints.rust]
missing_docs = "warn"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(algea_force_simd, values(none(), "true", "false"))'] }

[lints.clippy]
missing_inline_in_public_items = "warn"
