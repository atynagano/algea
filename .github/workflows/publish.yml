name: Publish to crates.io

on:
  push:
    tags:
      - 'v*'

permissions: {}

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: release
      url: https://crates.io/crates/algea
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable

      - name: Verify tag and package version
        id: package
        shell: bash
        run: |
          package="$(cargo metadata --no-deps --format-version 1 | python3 -c '
          import json
          import sys

          package = json.load(sys.stdin)["packages"][0]
          print(package["name"], package["version"])
          ')"
          read -r crate_name crate_version <<<"${package}"

          if [[ "${GITHUB_REF_NAME}" != "v${crate_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match ${crate_name} v${crate_version}." >&2
            exit 1
          fi

          echo "name=${crate_name}" >>"${GITHUB_OUTPUT}"
          echo "version=${crate_version}" >>"${GITHUB_OUTPUT}"

      - name: Check whether the version is already published
        id: registry
        shell: bash
        run: |
          # crates.io answers 403 to a request without an identifying user agent, which this step
          # would then report as an unexpected status.
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --user-agent "algea release workflow (https://github.com/${GITHUB_REPOSITORY})" \
            "https://crates.io/api/v1/crates/${{ steps.package.outputs.name }}/${{ steps.package.outputs.version }}")"

          case "${status}" in
            200)
              echo "publish=false" >>"${GITHUB_OUTPUT}"
              ;;
            404)
              echo "publish=true" >>"${GITHUB_OUTPUT}"
              ;;
            *)
              echo "crates.io returned HTTP ${status} while checking the package version." >&2
              exit 1
              ;;
          esac

      - name: Package and verify
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish --dry-run --locked

      - name: Authenticate with crates.io
        if: steps.registry.outputs.publish == 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish
        if: steps.registry.outputs.publish == 'true'
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

      - name: Report an existing release
        if: steps.registry.outputs.publish == 'false'
        run: |
          echo "::notice::${{ steps.package.outputs.name }} v${{ steps.package.outputs.version }} is already published."
